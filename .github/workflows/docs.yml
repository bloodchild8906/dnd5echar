name: 📚 Generate Documentation

on:
  push:
    tags:
      - 'Docs'
      - 'docs'
  workflow_dispatch:

env:
  NODE_VERSION: '20.19.0'
  PNPM_VERSION: '10.32.1'

jobs:
  docs:
    name: 📚 TypeDoc Generation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6

      - name: 📋 Documentation Info
        run: |
          echo "::group::📚 Documentation Generation"
          echo "📝 Event: ${{ github.event_name }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "🔀 Commit: ${{ github.sha }}"
          echo "👤 Actor: ${{ github.actor }}"
          echo "::endgroup::"

      - name: 🟢 Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: ⬢ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 📦 Install Dependencies
        id: install
        run: |
          echo "::group::📥 Installing Dependencies"
          pnpm install --frozen-lockfile --prefer-offline
          echo "✅ Dependencies installed"
          echo "::endgroup::"

      - name: 📚 Generate TypeDoc
        id: docs
        run: |
          echo "::group::📚 Generating TypeDoc Documentation"
          pnpm docs 2>&1 | tee docs.log
          echo "✅ Documentation generated"
          if [ -d docs ]; then
            echo "📁 Documentation files created:"
            ls -lh docs/
          fi
          echo "::endgroup::"

      - name: 📤 Upload Documentation
        uses: actions/upload-artifact@v7
        with:
          name: 📚 typedoc
          path: docs/
          retention-days: 14

      - name: 📝 Documentation Summary
        if: always()
        run: |
          echo "## 📚 Documentation Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Dependencies | ${{ steps.install.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📚 TypeDoc | ${{ steps.docs.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.docs.outcome }}" == "success" ]; then
            echo "## ✅ Documentation Generated Successfully!" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Documentation Generation Failed" >> $GITHUB_STEP_SUMMARY
          fi
