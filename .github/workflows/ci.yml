name: 🚀 CI - Publish Build

on:
  push:
    tags:
      - 'Publish'

env:
  NODE_VERSION: '20.19.0'
  PNPM_VERSION: '10.32.1'

jobs:
  build-and-publish:
    name: 🔨 Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 📋 Workflow Information
        run: |
          echo "::group::🔍 Workflow Details"
          echo "🏷️  Trigger: Tag '${{ github.ref_name }}'"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
          echo "📁 Repository: ${{ github.repository }}"
          echo "⏰ Started at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "::endgroup::"

      - name: 🟢 Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: ⬢ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 📦 Install Dependencies
        id: install
        run: |
          echo "::group::📥 Installing Dependencies"
          pnpm install --frozen-lockfile --prefer-offline
          echo "✅ Dependencies installed successfully"
          echo "📊 Total packages: $(pnpm list --depth=0 | wc -l)"
          echo "::endgroup::"

      - name: 🔍 Environment Info
        run: |
          echo "::group::🌍 Environment Information"
          echo "🟢 Node.js: $(node --version)"
          echo "📦 pnpm: $(pnpm --version)"
          echo "🏗️  Vite: $(pnpm list vite --depth=0 | grep vite || echo 'version from lockfile')"
          echo "⚛️  React: $(pnpm list react --depth=0 | grep react || echo 'version from lockfile')"
          echo "::endgroup::"

      - name: 🧪 Full CI Pipeline
        id: ci
        run: |
          echo "::group::🧪 Running Full CI Pipeline"
          pnpm ci
          echo "✅ All CI checks passed!"
          echo "::endgroup::"

      - name: 🏗️  Production Build
        id: build
        run: |
          echo "::group::🏗️  Building for Production"
          pnpm build:only
          echo "✅ Build completed successfully"
          echo "::endgroup::"
        env:
          VITE_APP_ENV: production
          VITE_APP_NAME: 5e Sheet Manager
          VITE_DEFAULT_OPEN5E_DOCUMENT: 5esrd
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 📊 Build Analysis
        id: analysis
        run: |
          echo "::group::📊 Build Analysis"
          if [ -d "dist" ]; then
            echo "📁 dist/ directory contents:"
            ls -lh dist/
            echo ""
            echo "📦 Total build size:"
            du -sh dist/ | cut -f1
            echo ""
            echo "📈 File count by extension:"
            find dist -type f | sed 's/.*\.//' | sort | uniq -c | sort -rn | head -10
            echo ""
          else
            echo "⚠️  dist/ directory not found!"
            exit 1
          fi
          echo "::endgroup::"

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: 🎯 production-dist
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: 📝 Job Summary
        if: always()
        run: |
          echo "## 🚀 CI - Publish Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📥 Checkout | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Install | ${{ steps.install.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 CI Pipeline | ${{ steps.ci.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️  Build | ${{ steps.build.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📤 Upload Artifact | ${{ steps.analysis.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🏷️  Tag:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**📝 Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**👤 Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**⏰ Duration:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.build.outcome }}" == "success" ] && [ -d "dist" ]; then
            echo "### 📦 Build Output" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            ls -lh dist/ >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

