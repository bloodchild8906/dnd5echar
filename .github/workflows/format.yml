name: 💅 Format Check

on:
  push:
    tags:
      - 'Format'
      - 'format'
  workflow_dispatch:

env:
  NODE_VERSION: '20.19.0'
  PNPM_VERSION: '10.32.1'

jobs:
  format:
    name: 💅 Code Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6

      - name: 📋 Format Check Info
        run: |
          echo "::group::💅 Format Check Configuration"
          echo "📝 Event: ${{ github.event_name }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "🔀 Commit: ${{ github.sha }}"
          echo "👤 Actor: ${{ github.actor }}"
          echo "::endgroup::"

      - name: 🟢 Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: ⬢ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 📦 Install Dependencies
        id: install
        run: |
          echo "::group::📥 Installing Dependencies"
          pnpm install --frozen-lockfile --prefer-offline
          echo "✅ Dependencies installed"
          echo "::endgroup::"

      - name: 💅 Check Code Formatting
        id: format
        run: |
          echo "::group::💅 Running Prettier Format Check"
          pnpm format:check 2>&1 | tee format.log
          echo "✅ Code is properly formatted!"
          echo "::endgroup::"

      - name: 📝 Format Summary
        if: always()
        run: |
          echo "## 💅 Format Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Dependencies | ${{ steps.install.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 💅 Prettier | ${{ steps.format.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.format.outcome }}" == "success" ]; then
            echo "## ✅ Code is Properly Formatted!" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Code Formatting Issues Found" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Run \`pnpm format\` locally to fix formatting issues." >> $GITHUB_STEP_SUMMARY
          fi
